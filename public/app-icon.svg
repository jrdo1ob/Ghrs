<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#86efac;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4ade80;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGrad)"/>
  
  <!-- Inner circle -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.2"/>
  
  <!-- Arabic letter غ stylized as sprout -->
  <g filter="url(#shadow)">
    <!-- Stem -->
    <path d="M256 350 C256 350, 256 250, 256 220" stroke="white" stroke-width="12" stroke-linecap="round" fill="none"/>
    
    <!-- Left leaf -->
    <path d="M256 280 C220 260, 200 220, 220 190 C240 160, 256 230, 256 280" fill="url(#leafGrad)"/>
    
    <!-- Right leaf -->
    <path d="M256 250 C292 230, 312 190, 292 160 C272 130, 256 200, 256 250" fill="#bbf7d0"/>
    
    <!-- Top bud -->
    <circle cx="256" cy="195" r="15" fill="#4ade80"/>
    
    <!-- Small sparkles -->
    <circle cx="200" cy="150" r="4" fill="white" opacity="0.6"/>
    <circle cx="312" cy="140" r="3" fill="white" opacity="0.5"/>
    <circle cx="180" cy="200" r="3" fill="white" opacity="0.4"/>
    <circle cx="330" cy="190" r="4" fill="white" opacity="0.5"/>
  </g>
  
  <!-- Text at bottom -->
  <text x="256" y="420" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="48" font-weight="bold">غرس</text>
  
  <!-- Glow effect -->
  <circle cx="256" cy="256" r="250" fill="none" stroke="white" stroke-width="2" opacity="0.1"/>
</svg>
